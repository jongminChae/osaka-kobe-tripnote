<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132a35"><title>코딩마작 실전·복습 V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f3f5;color:#172d39;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{background:#142b38;color:#fff;padding:20px 16px}header h1{font-size:23px;margin:3px 0}header small{opacity:.8}main{max-width:750px;margin:auto;padding:14px 13px 90px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}.mode button{background:white;border:1px solid #d5e0e5;padding:13px;font-weight:700}.mode .on{background:#176e68;color:white}.steps{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px}.steps button{white-space:nowrap;background:white;border:1px solid #dce3e8;padding:10px 12px}.steps .on{background:#176e68;color:white}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px;background:#e9eff1;color:#183442}.panel{background:white;border-radius:17px;padding:20px 17px;margin-bottom:14px;box-shadow:0 3px 14px #162a3510}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:19px 0 8px}p{margin:9px 0}.hint{background:#eaf5f2;border-left:4px solid #176e68;border-radius:7px;padding:13px;margin:12px 0}.warn{background:#fff4e6;border-left:4px solid #c88a27;border-radius:7px;padding:12px;margin:12px 0}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#f6f8f9;border:1px solid #dbe3e7}.choice.on{background:#e3f4ee;border:2px solid #176e68}.check{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #e7edef;align-items:flex-start}.check input{margin-top:4px;accent-color:#176e68;width:19px;height:19px;flex-shrink:0}.muted{font-size:13px;color:#627783}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}.primary{background:#176e68;color:white}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.nav button{flex:1;min-width:105px}input[type=number],select{padding:10px;border:1px solid #cddce2;border-radius:10px;font:inherit;max-width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{display:inline-flex;align-items:center;justify-content:center;background:#fff8e8;border:1px solid #d2c9b4;border-bottom:4px solid #bcb29c;border-radius:7px;min-width:36px;height:46px;font-weight:700;margin:2px}.tag{font-size:12px;border-radius:20px;background:#e5edf0;padding:4px 8px}.quiz{margin:16px 0;padding:13px;border:1px solid #e0e7eb;border-radius:12px}.hidden{display:none!important}.sticky{position:sticky;top:0;background:#f0f3f5;padding:7px 0;z-index:3}footer{text-align:center;margin:18px 0;color:#667b87;font-size:12px}a{color:#12645f}ul{padding-left:22px}li{margin:6px 0}
</style></head><body><header><small>V2 · 모바일 실전 판단 + 반복 복습</small><h1>🀄 코딩마작 플레이 도우미</h1><small>일급천재 강의의 기본 규칙을 체크하며 익히기</small></header><main><div class="sticky"><div class="mode"><button id="mode-play" onclick="setMode('play')">🎮 실전 모드</button><button id="mode-study" onclick="setMode('study')">📖 복습 모드</button></div></div><div id="play"><div class="steps" id="steps"></div><div class="panel"><h2 id="stepTitle"></h2><div id="stepContent"></div><div class="actions"><button onclick="stepMove(-1)">← 이전</button><button class="primary" onclick="stepMove(1)">다음 단계 →</button></div></div><div class="panel"><h3>이번 국 체크 현황</h3><div id="progress"></div><div class="actions"><button onclick="resetStep()">현재 단계 초기화</button><button onclick="resetHand()">🔄 새 국 시작</button></div></div></div><div id="study" class="hidden"><div class="panel"><h2>📖 코딩마작 핵심 복습</h2><p>전체 대본을 바탕으로 강의 흐름에 따라 상세히 재구성한 읽기 교재입니다. 원본 영상의 화면 속 패 모양은 대본만으로 정확히 복원할 수 없어 예시 패는 별도 학습 예시입니다.</p><div class="nav" id="topics"></div><div id="studyContent"></div></div><div class="panel"><h2>🧠 빠른 복습 퀴즈</h2><div id="quiz"></div><button onclick="resetQuiz()">퀴즈 다시 풀기</button></div></div><footer>강의의 단순화된 학습 규칙이며 최적의 타패·울기·공수를 보장하지 않습니다.<br>데이터는 현재 브라우저에만 저장됩니다.</footer></main><script>
const $=id=>document.getElementById(id),names=['역 선택','고립패','5블록','울기','텐파이','공수'],topics=["강의 소개와 연습 준비","첫 판단: 네 가지 역","타패: 자패와 고립패","5블록·6블록과 유효패","울기·리치·대기 매수","특수 역과 지식의 저주","공수 판단과 예외 처리","한 국 전체 복기와 학습 루틴"];
let s={mode:'play',step:0,topic:0,checks:{},choices:{},quiz:{}};try{s={...s,...JSON.parse(localStorage.getItem('coding-mahjong-v2')||'{}')}}catch(e){}const save=()=>localStorage.setItem('coding-mahjong-v2',JSON.stringify(s));function setMode(v){s.mode=v;save();render()}function stepMove(n){s.step=Math.max(0,Math.min(5,s.step+n));save();render();window.scrollTo(0,0)}function stepGo(i){s.step=i;save();render()}function pick(key,v){s.choices[key]=v;save();render()}function checked(key,v){s.checks[key]=v;save();render()}function chk(key,label){return '<label class="check"><input type="checkbox" '+(s.checks[key]?'checked':'')+' onchange="checked(\''+key+'\',this.checked)"><span>'+label+'</span></label>'}function choices(key,opts){return opts.map(o=>'<button class="choice '+(s.choices[key]===o[0]?'on':'')+'" onclick="pick(\''+key+'\',\''+o[0]+'\')">'+o[1]+'</button>').join('')}function note(t){return '<div class="hint">'+t+'</div>'}function warn(t){return '<div class="warn">'+t+'</div>'}
function content(i){let c=s.choices;
if(i===0)return '<p>배패를 받으면 <b>가장 먼저 성립하기 쉬운 역</b>을 확인하세요. 여러 역이 동시에 보일 수도 있습니다.</p>'+chk('y1','역패(백·발·중·자풍·장풍)로 3장 몸통을 만들 가능성이 있는가?')+chk('y2','1·9·자패를 버리고 탕야오(2~8만 사용)를 노릴 수 있는가?')+chk('y3','한 종류의 수패와 자패로 혼일색을 노릴 만한가?')+chk('y4','위 세 가지가 애매하다면 멘젠을 유지하고 리치를 목표로 하는가?')+note('강의에서 먼저 익히라고 권하는 4가지: <b>리치·역패·탕야오·혼일색</b>. 특수 역을 억지로 노리기보다 기본 화료 형태를 우선하세요.');
if(i===1)return '<p>쯔모할 때마다 <b>버릴 후보</b>를 아래 순서대로 찾습니다.</p>'+chk('d1','① 고립된 불필요한 자패를 확인했다 (이미 버려진 자패는 활용도가 더 낮아질 수 있음)')+chk('d2','② 고립된 1·9를 확인했다')+chk('d3','③ 다른 고립 수패를 확인했다')+chk('d4','④ 양면(예: 4·5), 머리 후보, 연결된 2장 블록을 함부로 깨지 않았다')+chk('d5','⑤ 지금 버리면 남는 유효패가 얼마나 되는지 비교했다')+note('예시: <span class="tile">4만</span><span class="tile">5만</span>은 3만·6만으로 이어지는 양면 블록이므로, 단독으로 떨어진 패보다 우선 보존하는 것이 기본입니다.')+warn('이 순서는 학습용 우선순위입니다. 이미 성립한 역·도라·안전패·복합형에 따라 달라집니다.');
if(i===2)return '<p>기본 완성형은 <b>몸통 4개 + 머리 1개</b>입니다. 현재 블록 후보를 세어 보세요.</p>'+choices('blocks',[['low','4개 이하'],['five','5개'],['six','6개 이상']])+note(c.blocks==='low'?'아직 블록이 부족합니다. 고립패에서 새 연결을 만들 여지를 찾으세요.':c.blocks==='five'?'5블록이 확보되었습니다. 좋은 형태를 유지하면서 유효패를 늘리세요.':c.blocks==='six'?'6블록 이상입니다. 약한 블록을 줄이되 양면·복합형의 유효패를 비교하세요.':'블록 수를 선택하면 권장 행동이 나타납니다.')+chk('b1','머리(같은 패 2장) 후보를 확인했다')+chk('b2','양면·간짱·변짱 등 블록의 강약을 비교했다')+chk('b3','상대 버림패와 내 손패에 보이는 패를 고려했다')+warn('블록 계산은 복합형에서 단순하지 않습니다. 4장 이상의 연결패를 기계적으로 쪼개지 마세요.');
if(i===3)return '<p>상대의 버림패로 치·퐁할 수 있을 때 <b>울고 난 뒤에도 역이 남는지</b> 먼저 확인하세요.</p>'+choices('call',[['yakuhai','역패로 화료 가능'],['tanyao','탕야오로 화료 가능 (쿠이탕 허용 룰)'],['honitsu','혼일색으로 화료 가능'],['none','확실한 역이 없음']])+note(!c.call?'상황을 선택하세요.':c.call==='none'?'기본 권장: <b>울지 말고 멘젠 유지</b>. 리치를 노리세요.':'울기를 <b>검토할 수 있습니다</b>. 실제로 역이 성립하는지와 속도·패 모양을 확인하세요.')+chk('c1','울고 난 뒤에도 성립하는 역을 정확히 확인했다')+chk('c2','울어서 텐파이까지 얼마나 가까워지는지 확인했다')+warn('리치는 멘젠이 필요합니다. 역패는 3장 몸통이 완성되어야 역이 됩니다.');
if(i===4)return '<p>텐파이가 되었다면 리치 여부와 대기 형태를 확인하세요.</p>'+choices('ready',[['closed','멘젠 텐파이'],['open','운 상태의 텐파이'],['no','아직 텐파이가 아님']])+note(c.ready==='closed'?'강의 기본값: <b>리치</b>. 대기 매수와 위험도도 확인하세요.':c.ready==='open'?'리치할 수 없습니다. <b>역이 있는지</b> 확인하세요.':c.ready==='no'?'조패를 계속하세요. 상대 공격이 있다면 공수 판단으로 이동하세요.':'현재 상태를 선택하세요.')+'<h3>대기패 계산기</h3><p class="muted">대기패 종류를 직접 선택하고, 그 패가 내 손패·공개된 패에 몇 장 보이는지 입력하세요. 패 종류별로 총 4장입니다.</p><div class="pair"><div><label>대기패 종류<br><select id="waitKind" onchange="calcWait()"><option value="ryan">양면 (서로 다른 2종)</option><option value="kan">간짱 (1종)</option><option value="pen">변짱 (1종)</option><option value="tank">단기 (1종)</option><option value="shan">샤보 (서로 다른 2종)</option></select></label></div><div><label>첫 번째 패 보인 장수<br><input id="seen1" type="number" min="0" max="4" value="0" oninput="calcWait()"></label></div></div><div id="secondSeen"><label>두 번째 패 보인 장수<br><input id="seen2" type="number" min="0" max="4" value="0" oninput="calcWait()"></label></div><div class="hint" id="waitResult"></div><p class="muted">손패의 대기 구성패도 보인 장수에 포함합니다. 예: 샤보라면 손패의 또이쯔 각 2장 포함. 양면 대기에서는 4·5를 들고 3·6을 기다릴 때 3·6의 공개된 장수를 입력합니다. 강의의 ‘남은 유효패 비교’를 연습하기 위한 추가 계산 도구입니다.</p>'+chk('r1','멘젠 텐파이라면 리치를 검토했다')+chk('r2','내가 기다리는 패의 남은 장수를 확인했다');
return '<p>상대가 리치하거나 공격하는 상황에서 강의의 <b>단순화된 기준선</b>을 적용합니다.</p>'+choices('def',[['ready','나는 텐파이'],['not','나는 노텐']])+choices('rank',[['last','현재 4위'],['other','현재 4위가 아님']])+note(!c.def?'텐파이 여부를 먼저 선택하세요.':c.rank==='last'?'4위일 때는 점수 상황에 따라 예외가 있습니다. 무조건 접는 규칙으로 보지 마세요.':c.def==='ready'?'강의의 기본값: <b>텐파이면 밀기</b>. 실제 위험도에 따른 예외를 차차 학습하세요.':'강의의 기본값: <b>노텐이면 수비</b>. 안전패를 찾아 베타오리를 검토하세요.')+chk('f1','현재 텐파이 여부를 확인했다')+chk('f2','현재 순위와 점수 상황을 확인했다')+chk('f3','상대의 안전패를 확인했다')+warn('텐파이여도 무조건 공격이 최적은 아닙니다. 이 규칙은 입문자용 연습 기준입니다.');}
function renderPlay(){ $('steps').innerHTML=names.map((n,i)=>'<button class="'+(s.step===i?'on':'')+'" onclick="stepGo('+i+')">'+(i+1)+'. '+n+'</button>').join('');$('stepTitle').textContent=(s.step+1)+'. '+names[s.step];$('stepContent').innerHTML=content(s.step);$('progress').innerHTML='완료한 체크 항목: <b>'+Object.values(s.checks).filter(Boolean).length+'개</b><p class="muted">다른 단계로 이동해도 체크 내용이 유지됩니다.</p>';if(s.step===4)calcWait()}
function calcWait(){let k=$('waitKind').value,dual=['ryan','shan'].includes(k);$('secondSeen').style.display=dual?'block':'none';let a=Math.max(0,Math.min(4,Number($('seen1').value)||0)),b=dual?Math.max(0,Math.min(4,Number($('seen2').value)||0)):0;let count=(dual?8:4)-a-b;$('waitResult').innerHTML='남은 대기패: <b>'+count+'장</b> / 최대 '+(dual?8:4)+'장'+(k==='shan'?' (샤보는 손패의 또이쯔 각 2장을 보인 장수에 포함해야 합니다)':'')}
const study=["\n<h3>1. 코딩마작 강의가 해결하려는 문제</h3>\n<p>강사는 초보자가 마작을 배우는 과정에서 너무 많은 지식과 예외를 동시에 익히려다가 오히려 판단이 흔들리는 문제를 지적합니다. 그래서 매번 복잡하게 고민하는 대신, 먼저 일정한 판단 순서를 정해 반복하는 방법을 '코딩마작'이라고 부릅니다.</p>\n<p>여기서 '코딩'은 실제 프로그램을 작성한다는 뜻이 아닙니다. <b>조건을 확인하고, 조건에 해당하면 정해진 행동을 선택하는 규칙 기반의 조패법</b>이라는 뜻입니다. 강사는 이 기초 규칙만으로도 작호(雀豪)를 목표로 연습할 수 있다고 강하게 주장합니다. 이는 강사의 학습 방향에 관한 주장이지, 승급이 보장된다는 의미는 아닙니다.</p>\n<h3>2. 작혼에서 혼자 연습하는 방법</h3>\n<ol><li>작혼에서 <b>친선전 방 만들기</b>를 선택합니다.</li><li>대국 방식은 <b>반장전</b>으로 설정합니다.</li><li>제한 시간을 <b>300초</b>로 설정합니다.</li><li>방을 만든 뒤 <b>AI 3명</b>을 추가하고 시작합니다.</li></ol>\n<p>강사는 단순 AI전으로 들어가면 한 국만 하고 끝날 수 있으므로, 친선전 방에서 반장전으로 연습하는 설정을 강조합니다. 초보자는 AI 난이도를 별도로 조정할 필요가 없다고 설명합니다.</p>\n<h3>3. 게임을 시작하면</h3>\n<p>배패를 받고 패 정리 기능으로 패를 정렬합니다. 그런 다음 다음 장에서 설명할 네 가지 역을 먼저 떠올립니다. 처음부터 모든 역을 탐색하는 것이 아니라, <b>미리 정해 둔 네 가지 기준으로 출발점을 정하는 것</b>이 강의의 핵심입니다.</p>\n<div class=\"hint\"><b>이 장의 핵심:</b> 연습 환경을 만들고, 매 국 같은 규칙을 적용하는 습관을 먼저 만듭니다.</div>\n","\n<h3>1. 무조건 알아야 하는 네 가지</h3>\n<p>강사가 '무조건 외우라'고 반복하는 것은 <b>리치, 역패, 탕야오, 혼일색</b>입니다. 강의는 이 네 가지의 기본 정의를 이미 공부한 사람을 대상으로 진행합니다. 따라서 아래 정의는 이해를 돕기 위해 덧붙인 <b>보충 설명</b>입니다.</p>\n<ul><li><b>리치:</b> 멘젠 상태에서 텐파이한 뒤 선언할 수 있는 역</li><li><b>역패:</b> 백·발·중 또는 자신의 자풍·장풍을 세 장 모아 만든 커쯔</li><li><b>탕야오:</b> 1·9·자패를 쓰지 않고 2~8 수패만으로 만드는 역</li><li><b>혼일색:</b> 한 종류의 수패와 자패만 사용하는 역</li></ul>\n<h3>2. 배패를 받고 무엇을 생각하는가?</h3>\n<p>패를 받으면 네 가지 중 어떤 방향이 자연스러운지 봅니다. 자패가 모여 있으면 역패를, 가운데 수패 위주라면 탕야오를, 한 종류의 수패가 몰려 있다면 혼일색을 검토할 수 있습니다. 하지만 이것은 방향을 찾는 것이지, 무조건 특정 역을 끝까지 밀라는 뜻은 아닙니다.</p>\n<h3>3. 아무것도 안 보이면?</h3>\n<p>강사는 여러 차례 '리치·역패·탕야오·혼일색 중 아무것도 안 보이면 리치'라고 말합니다. 여기서 중요한 것은 <b>멘젠을 유지하면서 일반적인 화료 형태를 만들어 가는 것</b>입니다. 특별한 역을 억지로 만들려고 패의 연결을 망가뜨리지 않습니다.</p>\n<div class=\"hint\"><b>강의식 의사결정:</b> 네 가지 역이 보이는가? → 보이면 그 방향을 검토 → 뚜렷한 방향이 없으면 리치 목표로 조패.</div>\n<div class=\"warn\">보충: 실제 대국에서는 여러 역이 겹칠 수 있고, 역패가 한두 장 있다는 사실만으로 역이 완성되는 것은 아닙니다.</div>\n","\n<h3>1. 가장 먼저 불필요한 자패를 정리</h3>\n<p>리치를 기본 목표로 삼았다면, 강사는 우선 활용하기 어려운 자패를 하나씩 버리는 모습을 보여줍니다. 특히 <b>이미 한 장이 다른 곳에 버려져 있는 자패</b>와 아직 활용 가능성이 남아 있는 자패를 비교합니다. 버려진 패가 많을수록 세 장을 모으기 어려워질 수 있기 때문입니다.</p>\n<p>자패를 모두 버리라는 뜻은 아닙니다. 역패가 될 수 있는 패, 두 장 이상 모인 자패, 혼일색에 활용할 자패는 따로 판단합니다. 강의 중에도 백과 남을 비교하며 역패 가능성이 있는 쪽을 남기는 사례가 등장합니다.</p>\n<h3>2. 그다음은 고립된 1과 9</h3>\n<p>자패 정리가 어느 정도 끝나면 1·9 수패를 비교합니다. 강사는 '붙어 있으면 남기고 혼자 남아 있으면 버린다'는 매우 간단한 기준을 강조합니다. 예를 들어 1만과 2만이 함께 있다면 연결 후보이지만, 주변에 아무 연결도 없는 9통은 고립패일 수 있습니다.</p>\n<p>강사는 이런 비교가 애매할 때 '코카콜라 맛있어'라고 장난스럽게 표현하며, 큰 차이가 없는 선택에서 지나치게 오래 고민하지 말라고 말합니다.</p>\n<h3>3. 고립 수패와 연결패의 차이</h3>\n<p>자패와 고립된 1·9 다음에는 다른 고립 수패를 정리합니다. 반면 <b>두 장으로 이어지는 블록은 쉽게 버리지 말라</b>고 반복합니다. 4만·5만처럼 3만 또는 6만으로 몸통을 완성할 수 있는 양면 블록은 고립패보다 유효패가 많습니다.</p>\n<h3>4. 4장짜리 연결에서 불필요한 패 찾기</h3>\n<p>영상에는 1·2·3 형태에 추가 1이 붙어 있을 때, 어떤 패를 버려도 기다리는 패가 사실상 달라지지 않는 상황을 설명하는 대목이 있습니다. 강사는 이런 경우 불필요해진 끝 패를 고립패처럼 정리합니다.</p>\n<div class=\"warn\">대본에는 해당 장면의 정확한 14장 손패가 없으므로, 이 설명을 특정 패 모양의 정답으로 일반화할 수는 없습니다. 실제 패 배열에 따라 판단이 달라집니다.</div>\n<h3>5. 실제로 적용하는 질문</h3>\n<ol><li>역패나 혼일색에 필요한 자패인가?</li><li>이미 몇 장이 보이는가?</li><li>혼자 떨어진 1·9가 있는가?</li><li>양면·머리 후보를 실수로 깨고 있지 않은가?</li><li>이 패를 버리면 다음에 받을 수 있는 유효패가 줄어드는가?</li></ol>\n<div class=\"hint\"><b>기억할 문장:</b> 자패 → 고립된 1·9 → 다른 고립패를 살피고, 연결된 두 장짜리 블록은 우선 보존합니다.</div>\n","\n<h3>1. 블록이란 무엇인가?</h3>\n<p>강사는 블록을 '몸통이나 머리가 될 후보군'이라고 설명합니다. 기본 화료형은 몸통 네 개와 머리 한 개이므로, <b>5블록을 구성하는 관점</b>이 조패의 기본이 됩니다. 이미 완성된 몸통뿐 아니라 양면·간짱 같은 미완성 몸통 후보와 머리 후보를 함께 봅니다.</p>\n<h3>2. 6블록이 되면 무엇을 버릴까?</h3>\n<p>영상에서 강사는 손패의 블록을 하나, 둘, 셋 하고 직접 세다가 6블록이 된 상황을 보여줍니다. 이때 모든 블록을 유지하려고 하지 않고, <b>어느 블록을 정리할지</b> 선택해야 한다고 설명합니다.</p>\n<p>우선 양면처럼 좋은 형태를 후보에서 제외하고, 남은 약한 블록들을 비교합니다. 단순히 숫자가 낮거나 높다는 이유만으로 버리는 것이 아니라, <b>실제로 몇 장의 유효패가 남아 있는지</b> 봅니다.</p>\n<h3>3. 유효패 수 비교</h3>\n<p>강의에서는 상대 버림패와 공개된 패를 보면서 '3통이 하나 보인다', '7만이 하나 보인다'고 세는 장면이 있습니다. 두 블록이 비슷해 보여도 유효패가 이미 많이 버려졌다면 그 블록의 가치가 낮아질 수 있습니다.</p>\n<p><b>학습용 예시:</b> 4만·5만 양면은 3만과 6만을 기다립니다. 각 패는 전체 네 장이므로 아무것도 보이지 않는다면 이론상 8장입니다. 3만이 한 장, 6만이 두 장 보인다면 남은 유효패는 5장입니다. 여기서 '보인다'에는 자신의 손패와 공개된 패가 포함됩니다.</p>\n<h3>4. 4장 복합형을 깨는 문제</h3>\n<p>강사는 한 장면에서 5블록 상태인데 4장짜리 연결 블록이 있는 경우, 그 블록을 나누는 선택을 보여줍니다. 이후 새 패가 붙으면서 다시 블록 수를 세고 정리합니다. 이는 <b>블록을 고정된 모양으로만 보지 않고, 쯔모할 때마다 다시 계산한다</b>는 맥락입니다.</p>\n<div class=\"warn\"><b>중요한 제한:</b> 자동 대본만으로는 강사가 가리킨 4장짜리 패의 정확한 배열을 복원할 수 없습니다. 따라서 '4장 블록은 항상 깨라'는 규칙으로 받아들이면 안 됩니다.</div>\n<h3>5. 강의가 시뮬레이터와 다르다고 말하는 이유</h3>\n<p>강사는 단순히 고립패를 자동으로 버리는 방식과는 다르다고 말합니다. 블록을 선택하고, 상대에게 이미 보인 패의 개수를 비교하며, 그때그때 더 나은 형태를 남긴다는 점을 강조합니다.</p>\n<div class=\"hint\"><b>실전 루틴:</b> 블록 세기 → 6개 이상이면 양면 등 좋은 형태 보존 → 약한 블록의 유효패 비교 → 하나 정리 → 다음 쯔모 후 다시 계산.</div>\n","\n<h3>1. 울기 전에 확인할 세 가지 역</h3>\n<p>강사는 울기 판단을 특히 강조합니다. <b>역패·탕야오·혼일색</b> 중 하나가 보여야 치·퐁을 검토하라고 반복합니다. 이 세 가지가 전혀 보이지 않으면 울지 않는 것이 강의의 기본값입니다.</p>\n<p>왜 리치는 빠질까요? 리치는 멘젠 상태에서 선언해야 하므로, 울고 나면 리치를 목표로 할 수 없기 때문입니다. 따라서 '울면 빨리 텐파이할 수 있다'는 이유만으로 무작정 울면, 역이 없어 화료하지 못하는 상황이 생길 수 있습니다.</p>\n<h3>2. 탕야오가 보일 때</h3>\n<p>영상에서 강사는 탕야오 방향이 보이는 장면을 두고 울어도 된다고 설명합니다. 다만 한 장면에서는 '원래 이 패부터 울면 안 되는 건데'라는 취지의 말도 덧붙입니다. 즉, 이 강의의 울기 규칙은 판단을 단순화하기 위한 출발점이지 모든 울기가 최선이라는 뜻은 아닙니다.</p>\n<div class=\"warn\">보충: 울어서 탕야오를 인정하는지는 대국 규칙의 쿠이탕 허용 여부를 확인해야 합니다.</div>\n<h3>3. 멘젠 텐파이라면 리치</h3>\n<p>강사는 '리치 버튼이 뜨면 리치 버튼을 누르라'는 식으로 단순한 기본 행동을 제시합니다. 리치가 가능한 상태라면 우선 리치를 기준으로 연습하라는 뜻입니다.</p>\n<h3>4. 여러 대기 중에서는 매수가 많은 쪽</h3>\n<p>강의에는 서로 다른 대기 후보의 남은 패 수를 '두 장, 두 장, 네 장'처럼 비교하는 장면이 나옵니다. 그중 <b>남은 화료패 수가 많은 대기</b>를 고르는 것이 기본입니다. 특정 대기 이름을 외우는 것보다 실제 남은 장수를 세는 습관이 중요합니다.</p>\n<p><b>보충 예시:</b> 양면 대기는 보통 두 종류의 패를 기다리고, 간짱·변짱·단기는 한 종류를 기다립니다. 하지만 이미 보인 패가 많다면 양면의 실질 대기 매수도 줄어듭니다. 샤보 대기는 손패에 이미 같은 패가 두 장씩 있으므로 그 장수도 차감해야 합니다.</p>\n<h3>5. 높은 점수보다 속도를 우선하는 태도</h3>\n<p>강사는 높은 타점을 상상하며 무리하게 패를 남기는 것보다, 현재 완성할 수 있는 화료를 향해 진행하는 태도를 강조합니다. 도라나 높은 역을 무조건 포기하라는 보편 규칙이 아니라, 초보자가 타점 욕심 때문에 조패를 망치는 문제를 경계하는 맥락입니다.</p>\n<div class=\"hint\"><b>실전 질문:</b> 울어도 역이 있는가? → 텐파이인가? → 멘젠이면 리치 가능한가? → 선택 가능한 대기 중 남은 패가 많은 쪽은?</div>\n","\n<h3>1. 왜 다른 역을 일단 무시하라고 할까?</h3>\n<p>강사는 삼색동순, 일기통관, 치또이츠, 또이또이, 국사무쌍과 같은 역을 초보자가 매번 의도적으로 찾을 필요가 없다고 강하게 말합니다. 이러한 역을 모르면 안 된다는 뜻이 아니라, <b>기본 조패가 익숙하지 않은 단계에서 지나치게 많은 목표를 동시에 세우지 말라</b>는 취지입니다.</p>\n<h3>2. 또이또이가 우연히 나오는 장면</h3>\n<p>영상에서 강사는 특정 역을 노리지 않았는데 패가 모이다 보니 또이또이 형태가 된 사례를 보여줍니다. 이를 통해 '특수 역을 처음부터 계획하지 않아도 자연스럽게 성립하는 경우가 있다'고 설명합니다. 코딩마작의 목표는 특정 역을 수집하는 것이 아니라 기본 화료 가능성을 높이는 것입니다.</p>\n<h3>3. '지식의 저주'라는 표현</h3>\n<p>강사는 초보자가 여러 고급 이론을 어설프게 섞으면 오히려 판단이 불안정해질 수 있다고 지적합니다. 예를 들어 '삼색을 봐야 하나?', '도라를 아껴야 하나?', '수비를 위해 이 패를 남겨야 하나?' 같은 질문을 매 턴 동시에 하면 정해 둔 기준을 지키기 어렵습니다.</p>\n<p>이때 필요한 것은 지식을 영원히 버리는 일이 아니라, <b>기본 규칙을 먼저 자동화하고 나중에 예외를 추가하는 순서</b>입니다.</p>\n<h3>4. 코딩마작에는 로망이 없다</h3>\n<p>강사는 역만이나 특이한 대기를 만드는 재미 자체를 부정하지 않습니다. 다만 높은 역을 만드는 즐거움을 목표로 하는 플레이와, 승급을 위해 단순하고 재현 가능한 판단을 연습하는 플레이는 목적이 다르다고 구분합니다.</p>\n<p>국사무쌍이나 역만을 노리는 것이 재미있다면 그렇게 즐겨도 되지만, 이 강의에서는 승급을 목표로 하는 초보자에게 기본 조패에 집중하라고 권합니다.</p>\n<h3>5. 억울한 패배도 정상</h3>\n<p>영상에서는 상대가 쯔모로 이겨 버리는 장면을 두고 마작은 억울한 게임이라고 말합니다. 올바른 기준으로 판단했더라도 한 국의 결과는 운에 좌우됩니다. <b>결과가 나빴다고 그 판단이 반드시 틀렸다고 단정하지 않는 태도</b>가 중요합니다.</p>\n<div class=\"hint\"><b>핵심:</b> 기본 규칙을 익히는 동안은 특수 역을 억지로 찾지 말고, 자연스럽게 생기면 받아들이세요.</div>\n","\n<h3>1. 조패 다음에 더할 한 가지: 공수 판단</h3>\n<p>강사는 앞에서 설명한 조패 규칙에 공수 판단을 '한 스푼' 더하면 된다고 말합니다. 공수는 상대가 리치하거나 강하게 공격하는 상황에서 자신도 밀어붙일지, 안전패를 버리며 접을지를 결정하는 것입니다.</p>\n<h3>2. 강사가 제시한 가장 단순한 수비 코드</h3>\n<div class=\"hint\"><b>텐파이면 싸워라. 텐파이가 아니면 도망가라. 단, 꼴찌가 아닐 때.</b></div>\n<p>이것이 강의에서 제시하는 가장 단순한 기준선입니다. 자신이 텐파이했다면 기본적으로 공격하고, 텐파이가 아니라면 기본적으로 수비합니다. 다만 4위라면 점수 상황에 따라 달라질 수 있으므로 예외로 남깁니다.</p>\n<h3>3. 상대의 일발 가능성이 있어도?</h3>\n<p>강의에서 강사는 '일발이어도 싸우나요?'라는 질문에 텐파이라면 싸우라고 답합니다. 이는 초보자가 위험해 보이는 상황마다 규칙을 바꾸지 않도록 만든 <b>의도적으로 과감한 학습 기준</b>입니다.</p>\n<div class=\"warn\"><b>보충·주의:</b> 실제 최적 공수는 자신의 타점, 대기 매수, 상대의 위험도, 순목, 순위, 점수 차이에 따라 달라집니다. 텐파이했다고 무조건 위험패를 버리는 것이 정답은 아닙니다.</div>\n<h3>4. 왜 예외를 처음부터 전부 알려주지 않을까?</h3>\n<p>강사는 기준이 없으면 매 상황에서 무엇을 고민해야 할지도 정하기 어렵다고 설명합니다. 먼저 단순한 기본값을 만들고, 게임을 하면서 <b>어떤 상황에서 기본값을 바꿔야 하는지</b> 경험을 쌓으라는 것입니다.</p>\n<p>강의 후반에는 시청자들이 여러 예외 상황을 제시합니다. 강사는 그런 예외를 나중에 자신만의 공격·수비 기준에 덧붙여 나가는 것이 중급자로 성장하는 과정이라고 말합니다.</p>\n<h3>5. 초보에서 중급으로</h3>\n<p>강사의 표현을 빌리면, 기본 규칙만 따르는 단계는 아직 초급이지만, 이 기준으로 연습하는 초보자는 기준 없이 고급 지식을 섞는 플레이어보다 안정적으로 판단할 수 있습니다. 이후 예외 상황을 스스로 설명하고 조정할 수 있을 때 중급자로 나아간다는 관점입니다.</p>\n<div class=\"hint\"><b>핵심:</b> 기본 규칙은 정답지가 아니라 출발선입니다. 먼저 일관성을 만들고, 이후 근거 있는 예외를 추가합니다.</div>\n","\n<h3>1. 강의 전체를 한 번에 적용하는 순서</h3>\n<ol><li><b>배패:</b> 리치·역패·탕야오·혼일색 중 보이는 방향이 있는가?</li><li><b>첫 타패:</b> 불필요한 고립 자패가 있는가? 이미 버려진 자패는 몇 장인가?</li><li><b>수패 정리:</b> 고립된 1·9와 다른 고립 수패를 찾았는가?</li><li><b>블록 구성:</b> 연결된 2장 블록과 머리 후보를 보존했는가?</li><li><b>블록 초과:</b> 6블록 이상이면 약한 블록의 유효패 수를 비교했는가?</li><li><b>울기:</b> 역패·탕야오·혼일색 중 울어도 성립하는 역이 있는가?</li><li><b>텐파이:</b> 멘젠이면 리치 가능한가? 대기 후보의 남은 장수는?</li><li><b>상대 공격:</b> 나는 텐파이인가? 현재 4위인가?</li><li><b>국 종료:</b> 결과보다 판단 순서가 일관됐는지 복기했는가?</li></ol>\n<h3>2. 초보자에게 추천하는 연습</h3>\n<p><b>첫 번째 반장전:</b> 네 가지 역 중 무엇을 목표로 했는지만 기록합니다.</p>\n<p><b>두 번째 반장전:</b> 매 턴 고립 자패·1·9·연결패를 구분해 봅니다.</p>\n<p><b>세 번째 반장전:</b> 블록을 세고 6블록 이상일 때 정리 이유를 말해 봅니다.</p>\n<p><b>네 번째 반장전:</b> 울기와 리치 판단에 반드시 이유를 붙입니다.</p>\n<p><b>다섯 번째 반장전:</b> 상대 공격 시 텐파이·노텐과 순위를 먼저 확인합니다.</p>\n<h3>3. 잘못 판단한 장면을 복습하는 방법</h3>\n<p>결과가 패배였는지만 보지 말고 '그때 몇 블록이었나?', '왜 그 자패를 남겼나?', '울고 나서 역이 있었나?', '노텐인데 위험패를 밀었나?'를 기록합니다. 그리고 기본 규칙을 잘못 적용한 것인지, 예외가 필요한 상황이었는지 나눕니다.</p>\n<h3>4. 강의가 끝나며 강조하는 것</h3>\n<p>강사는 작호를 '튜토리얼이 끝나는 단계'라고 비유하며, 먼저 기초 조패와 공수 기준을 몸에 익히라고 말합니다. 코딩마작은 그 기초를 반복해서 연습하기 위한 방법입니다.</p>\n<div class=\"hint\"><b>오늘의 한 줄:</b> 네 가지 역을 기준으로 출발하고, 고립패부터 정리하며, 5블록과 유효패를 비교하고, 울기·리치·공수에 일관된 기본값을 적용한다.</div>\n<p><a href=\"https://www.youtube.com/watch?v=Mq24zlphw6Q\" target=\"_blank\" rel=\"noopener\">원본 강의 영상 보기</a></p>\n"];
const qs=[['강의에서 우선 익히라고 권한 역이 아닌 것은?',['리치','역패','국사무쌍'],'2','초반에는 특수 역을 의도적으로 노리기보다 기본 역을 우선합니다.'],['보통 가장 먼저 정리할 후보는?',['고립된 불필요한 자패','좋은 양면 블록','완성 몸통'],'0','불필요한 고립 자패부터 확인하는 것이 기본 순서입니다.'],['기본 화료형의 구성은?',['몸통 3개+머리 2개','몸통 4개+머리 1개','몸통 5개'],'1','4몸통과 1머리를 목표로 5블록을 관리합니다.'],['확실한 역 없이 울면?',['리치 가능','역이 없어 화료하지 못할 수 있음','항상 유리함'],'1','울기 전에 화료할 수 있는 역을 확인해야 합니다.'],['강의의 단순 공수 기준은?',['노텐이면 무조건 밀기','텐파이면 공격·노텐이면 수비','항상 공격'],'1','4위 등의 예외가 있고, 숙련되면 더 정교하게 판단합니다.']];
function quizRender(){$('quiz').innerHTML=qs.map((q,i)=>'<div class="quiz"><b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((o,j)=>'<button class="choice '+(s.quiz[i]===String(j)?'on':'')+'" onclick="answer('+i+','+j+')">'+o+'</button>').join('')+(s.quiz[i]===undefined?'':'<div class="'+(s.quiz[i]===q[2]?'hint':'warn')+'">'+(s.quiz[i]===q[2]?'정답! ':'다시 확인해 보세요. ')+q[3]+'</div>')+'</div>').join('');}
function answer(i,j){s.quiz[i]=String(j);save();quizRender()}function resetQuiz(){s.quiz={};save();quizRender()}function renderStudy(){$('topics').innerHTML=topics.map((t,i)=>'<button class="'+(s.topic===i?'primary':'')+'" onclick="s.topic='+i+';save();renderStudy()">'+t+'</button>').join('');$('studyContent').innerHTML=study[s.topic];quizRender()}
function resetStep(){Object.keys(s.checks).forEach(k=>{if(([['y'],['d'],['b'],['c'],['r'],['f']][s.step]).some(p=>k.startsWith(p)))delete s.checks[k]});save();render()}function resetHand(){if(!confirm('이번 국의 선택과 체크를 초기화할까요? 복습 퀴즈 기록은 유지됩니다.'))return;s.step=0;s.checks={};s.choices={};save();render()}function render(){$('mode-play').classList.toggle('on',s.mode==='play');$('mode-study').classList.toggle('on',s.mode==='study');$('play').classList.toggle('hidden',s.mode!=='play');$('study').classList.toggle('hidden',s.mode!=='study');if(s.mode==='play')renderPlay();else renderStudy()}render();
</script></body></html>
