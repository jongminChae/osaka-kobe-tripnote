<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132a35"><title>코딩마작 실전·복습 V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f3f5;color:#172d39;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{background:#142b38;color:#fff;padding:20px 16px}header h1{font-size:23px;margin:3px 0}header small{opacity:.8}main{max-width:750px;margin:auto;padding:14px 13px 90px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}.mode button{background:white;border:1px solid #d5e0e5;padding:13px;font-weight:700}.mode .on{background:#176e68;color:white}.steps{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px}.steps button{white-space:nowrap;background:white;border:1px solid #dce3e8;padding:10px 12px}.steps .on{background:#176e68;color:white}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px;background:#e9eff1;color:#183442}.panel{background:white;border-radius:17px;padding:20px 17px;margin-bottom:14px;box-shadow:0 3px 14px #162a3510}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:19px 0 8px}p{margin:9px 0}.hint{background:#eaf5f2;border-left:4px solid #176e68;border-radius:7px;padding:13px;margin:12px 0}.warn{background:#fff4e6;border-left:4px solid #c88a27;border-radius:7px;padding:12px;margin:12px 0}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#f6f8f9;border:1px solid #dbe3e7}.choice.on{background:#e3f4ee;border:2px solid #176e68}.check{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #e7edef;align-items:flex-start}.check input{margin-top:4px;accent-color:#176e68;width:19px;height:19px;flex-shrink:0}.muted{font-size:13px;color:#627783}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}.primary{background:#176e68;color:white}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.nav button{flex:1;min-width:105px}input[type=number],select{padding:10px;border:1px solid #cddce2;border-radius:10px;font:inherit;max-width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{display:inline-flex;align-items:center;justify-content:center;background:#fff8e8;border:1px solid #d2c9b4;border-bottom:4px solid #bcb29c;border-radius:7px;min-width:36px;height:46px;font-weight:700;margin:2px}.tag{font-size:12px;border-radius:20px;background:#e5edf0;padding:4px 8px}.quiz{margin:16px 0;padding:13px;border:1px solid #e0e7eb;border-radius:12px}.hidden{display:none!important}.sticky{position:sticky;top:0;background:#f0f3f5;padding:7px 0;z-index:3}footer{text-align:center;margin:18px 0;color:#667b87;font-size:12px}a{color:#12645f}ul{padding-left:22px}li{margin:6px 0}
</style></head><body><header><small>V2 · 모바일 실전 판단 + 반복 복습</small><h1>🀄 코딩마작 플레이 도우미</h1><small>일급천재 강의의 기본 규칙을 체크하며 익히기</small></header><main><div class="sticky"><div class="mode"><button id="mode-play" onclick="setMode('play')">🎮 실전 모드</button><button id="mode-study" onclick="setMode('study')">📖 복습 모드</button></div></div><div id="play"><div class="steps" id="steps"></div><div class="panel"><h2 id="stepTitle"></h2><div id="stepContent"></div><div class="actions"><button onclick="stepMove(-1)">← 이전</button><button class="primary" onclick="stepMove(1)">다음 단계 →</button></div></div><div class="panel"><h3>이번 국 체크 현황</h3><div id="progress"></div><div class="actions"><button onclick="resetStep()">현재 단계 초기화</button><button onclick="resetHand()">🔄 새 국 시작</button></div></div></div><div id="study" class="hidden"><div class="panel"><h2>📖 코딩마작 핵심 복습</h2><p>강의 내용을 실전에 적용하기 쉽도록 주제별로 재구성했습니다. 원본 영상의 화면 속 패 모양은 대본만으로 정확히 복원할 수 없어 예시 패는 별도 학습 예시입니다.</p><div class="nav" id="topics"></div><div id="studyContent"></div></div><div class="panel"><h2>🧠 빠른 복습 퀴즈</h2><div id="quiz"></div><button onclick="resetQuiz()">퀴즈 다시 풀기</button></div></div><footer>강의의 단순화된 학습 규칙이며 최적의 타패·울기·공수를 보장하지 않습니다.<br>데이터는 현재 브라우저에만 저장됩니다.</footer></main><script>
const $=id=>document.getElementById(id),names=['역 선택','고립패','5블록','울기','텐파이','공수'],topics=['핵심 철학','4가지 역','타패 우선순위','5블록 이론','울기·리치','공격과 수비','학습 루틴'];
let s={mode:'play',step:0,topic:0,checks:{},choices:{},quiz:{}};try{s={...s,...JSON.parse(localStorage.getItem('coding-mahjong-v2')||'{}')}}catch(e){}const save=()=>localStorage.setItem('coding-mahjong-v2',JSON.stringify(s));function setMode(v){s.mode=v;save();render()}function stepMove(n){s.step=Math.max(0,Math.min(5,s.step+n));save();render();window.scrollTo(0,0)}function stepGo(i){s.step=i;save();render()}function pick(key,v){s.choices[key]=v;save();render()}function checked(key,v){s.checks[key]=v;save();render()}function chk(key,label){return '<label class="check"><input type="checkbox" '+(s.checks[key]?'checked':'')+' onchange="checked(\''+key+'\',this.checked)"><span>'+label+'</span></label>'}function choices(key,opts){return opts.map(o=>'<button class="choice '+(s.choices[key]===o[0]?'on':'')+'" onclick="pick(\''+key+'\',\''+o[0]+'\')">'+o[1]+'</button>').join('')}function note(t){return '<div class="hint">'+t+'</div>'}function warn(t){return '<div class="warn">'+t+'</div>'}
function content(i){let c=s.choices;
if(i===0)return '<p>배패를 받으면 <b>가장 먼저 성립하기 쉬운 역</b>을 확인하세요. 여러 역이 동시에 보일 수도 있습니다.</p>'+chk('y1','역패(백·발·중·자풍·장풍)로 3장 몸통을 만들 가능성이 있는가?')+chk('y2','1·9·자패를 버리고 탕야오(2~8만 사용)를 노릴 수 있는가?')+chk('y3','한 종류의 수패와 자패로 혼일색을 노릴 만한가?')+chk('y4','위 세 가지가 애매하다면 멘젠을 유지하고 리치를 목표로 하는가?')+note('강의에서 먼저 익히라고 권하는 4가지: <b>리치·역패·탕야오·혼일색</b>. 특수 역을 억지로 노리기보다 기본 화료 형태를 우선하세요.');
if(i===1)return '<p>쯔모할 때마다 <b>버릴 후보</b>를 아래 순서대로 찾습니다.</p>'+chk('d1','① 고립된 불필요한 자패를 확인했다 (이미 버려진 자패는 활용도가 더 낮아질 수 있음)')+chk('d2','② 고립된 1·9를 확인했다')+chk('d3','③ 다른 고립 수패를 확인했다')+chk('d4','④ 양면(예: 4·5), 머리 후보, 연결된 2장 블록을 함부로 깨지 않았다')+chk('d5','⑤ 지금 버리면 남는 유효패가 얼마나 되는지 비교했다')+note('예시: <span class="tile">4만</span><span class="tile">5만</span>은 3만·6만으로 이어지는 양면 블록이므로, 단독으로 떨어진 패보다 우선 보존하는 것이 기본입니다.')+warn('이 순서는 학습용 우선순위입니다. 이미 성립한 역·도라·안전패·복합형에 따라 달라집니다.');
if(i===2)return '<p>기본 완성형은 <b>몸통 4개 + 머리 1개</b>입니다. 현재 블록 후보를 세어 보세요.</p>'+choices('blocks',[['low','4개 이하'],['five','5개'],['six','6개 이상']])+note(c.blocks==='low'?'아직 블록이 부족합니다. 고립패에서 새 연결을 만들 여지를 찾으세요.':c.blocks==='five'?'5블록이 확보되었습니다. 좋은 형태를 유지하면서 유효패를 늘리세요.':c.blocks==='six'?'6블록 이상입니다. 약한 블록을 줄이되 양면·복합형의 유효패를 비교하세요.':'블록 수를 선택하면 권장 행동이 나타납니다.')+chk('b1','머리(같은 패 2장) 후보를 확인했다')+chk('b2','양면·간짱·변짱 등 블록의 강약을 비교했다')+chk('b3','상대 버림패와 내 손패에 보이는 패를 고려했다')+warn('블록 계산은 복합형에서 단순하지 않습니다. 4장 이상의 연결패를 기계적으로 쪼개지 마세요.');
if(i===3)return '<p>상대의 버림패로 치·퐁할 수 있을 때 <b>울고 난 뒤에도 역이 남는지</b> 먼저 확인하세요.</p>'+choices('call',[['yakuhai','역패로 화료 가능'],['tanyao','탕야오로 화료 가능 (쿠이탕 허용 룰)'],['honitsu','혼일색으로 화료 가능'],['none','확실한 역이 없음']])+note(!c.call?'상황을 선택하세요.':c.call==='none'?'기본 권장: <b>울지 말고 멘젠 유지</b>. 리치를 노리세요.':'울기를 <b>검토할 수 있습니다</b>. 실제로 역이 성립하는지와 속도·패 모양을 확인하세요.')+chk('c1','울고 난 뒤에도 성립하는 역을 정확히 확인했다')+chk('c2','울어서 텐파이까지 얼마나 가까워지는지 확인했다')+warn('리치는 멘젠이 필요합니다. 역패는 3장 몸통이 완성되어야 역이 됩니다.');
if(i===4)return '<p>텐파이가 되었다면 리치 여부와 대기 형태를 확인하세요.</p>'+choices('ready',[['closed','멘젠 텐파이'],['open','운 상태의 텐파이'],['no','아직 텐파이가 아님']])+note(c.ready==='closed'?'강의 기본값: <b>리치</b>. 대기 매수와 위험도도 확인하세요.':c.ready==='open'?'리치할 수 없습니다. <b>역이 있는지</b> 확인하세요.':c.ready==='no'?'조패를 계속하세요. 상대 공격이 있다면 공수 판단으로 이동하세요.':'현재 상태를 선택하세요.')+'<h3>대기패 계산기</h3><p class="muted">대기패 종류를 직접 선택하고, 그 패가 내 손패·공개된 패에 몇 장 보이는지 입력하세요. 패 종류별로 총 4장입니다.</p><div class="pair"><div><label>대기패 종류<br><select id="waitKind" onchange="calcWait()"><option value="ryan">양면 (서로 다른 2종)</option><option value="kan">간짱 (1종)</option><option value="pen">변짱 (1종)</option><option value="tank">단기 (1종)</option><option value="shan">샤보 (서로 다른 2종)</option></select></label></div><div><label>첫 번째 패 보인 장수<br><input id="seen1" type="number" min="0" max="4" value="0" oninput="calcWait()"></label></div></div><div id="secondSeen"><label>두 번째 패 보인 장수<br><input id="seen2" type="number" min="0" max="4" value="0" oninput="calcWait()"></label></div><div class="hint" id="waitResult"></div><p class="muted">손패의 대기 구성패도 보인 장수에 포함합니다. 예: 샤보라면 손패의 또이쯔 각 2장 포함. 양면 대기에서는 4·5를 들고 3·6을 기다릴 때 3·6의 공개된 장수를 입력합니다. 강의의 ‘남은 유효패 비교’를 연습하기 위한 추가 계산 도구입니다.</p>'+chk('r1','멘젠 텐파이라면 리치를 검토했다')+chk('r2','내가 기다리는 패의 남은 장수를 확인했다');
return '<p>상대가 리치하거나 공격하는 상황에서 강의의 <b>단순화된 기준선</b>을 적용합니다.</p>'+choices('def',[['ready','나는 텐파이'],['not','나는 노텐']])+choices('rank',[['last','현재 4위'],['other','현재 4위가 아님']])+note(!c.def?'텐파이 여부를 먼저 선택하세요.':c.rank==='last'?'4위일 때는 점수 상황에 따라 예외가 있습니다. 무조건 접는 규칙으로 보지 마세요.':c.def==='ready'?'강의의 기본값: <b>텐파이면 밀기</b>. 실제 위험도에 따른 예외를 차차 학습하세요.':'강의의 기본값: <b>노텐이면 수비</b>. 안전패를 찾아 베타오리를 검토하세요.')+chk('f1','현재 텐파이 여부를 확인했다')+chk('f2','현재 순위와 점수 상황을 확인했다')+chk('f3','상대의 안전패를 확인했다')+warn('텐파이여도 무조건 공격이 최적은 아닙니다. 이 규칙은 입문자용 연습 기준입니다.');}
function renderPlay(){ $('steps').innerHTML=names.map((n,i)=>'<button class="'+(s.step===i?'on':'')+'" onclick="stepGo('+i+')">'+(i+1)+'. '+n+'</button>').join('');$('stepTitle').textContent=(s.step+1)+'. '+names[s.step];$('stepContent').innerHTML=content(s.step);$('progress').innerHTML='완료한 체크 항목: <b>'+Object.values(s.checks).filter(Boolean).length+'개</b><p class="muted">다른 단계로 이동해도 체크 내용이 유지됩니다.</p>';if(s.step===4)calcWait()}
function calcWait(){let k=$('waitKind').value,dual=['ryan','shan'].includes(k);$('secondSeen').style.display=dual?'block':'none';let a=Math.max(0,Math.min(4,Number($('seen1').value)||0)),b=dual?Math.max(0,Math.min(4,Number($('seen2').value)||0)):0;let count=(dual?8:4)-a-b;$('waitResult').innerHTML='남은 대기패: <b>'+count+'장</b> / 최대 '+(dual?8:4)+'장'+(k==='shan'?' (샤보는 손패의 또이쯔 각 2장을 보인 장수에 포함해야 합니다)':'')}
const study=[
'<h3>코딩마작이란?</h3><p>모든 상황을 완벽히 계산하기보다 <b>초보자가 반복해서 적용할 수 있는 판단 규칙</b>을 먼저 정하고, 익숙해지면 예외를 배우는 방식입니다.</p><ul><li>복잡한 역 욕심보다 기본 조패에 집중</li><li>같은 상황에 같은 판단 순서를 적용</li><li>실수한 장면을 복기하며 예외를 추가</li></ul>'+warn('강의에서 언급한 작호(雀豪) 도달은 목표·경험담의 맥락이지 결과를 보장하는 것은 아닙니다.'),
'<h3>우선 익힐 네 가지 역</h3><p><b>리치:</b> 멘젠 텐파이 후 선언하는 기본 역</p><p><b>역패:</b> 백·발·중·자풍·장풍을 3장 모아 몸통 완성</p><p><b>탕야오:</b> 1·9·자패 없이 2~8 수패만 사용</p><p><b>혼일색:</b> 한 종류의 수패와 자패로 구성</p>'+note('강의의 요지: 우선 이 네 가지를 기준으로 방향을 정하고, 다른 역은 자연스럽게 만들어지면 받아들이세요.')+'<p class="muted">참고: 울어서 탕야오를 인정하는지는 대국 룰(쿠이탕)에 따라 다릅니다.</p>',
'<h3>버릴 패를 찾는 순서</h3><ol><li>활용하기 어려운 고립 자패</li><li>고립된 1·9</li><li>그 밖의 고립 수패</li><li>연결된 패는 가급적 보존</li></ol>'+note('예시: <span class="tile">4통</span><span class="tile">5통</span>은 3통·6통을 받는 양면이므로 보통 고립패보다 가치가 높습니다.')+'<p>강의는 이미 버려진 자패, 남은 유효패 수를 함께 보라고 강조합니다.</p>',
'<h3>왜 5블록인가?</h3><p>기본 화료형은 <b>몸통 4개와 머리 1개</b>입니다. 따라서 완성 몸통과 몸통 후보, 머리 후보를 묶어 5개를 관리하는 관점이 유용합니다.</p><ul><li>4블록 이하: 블록을 늘리는 방향</li><li>5블록: 강한 블록 보존</li><li>6블록 이상: 약한 블록을 정리</li></ul>'+note('약한 블록 판단에서는 양면/간짱/변짱과 실제 남은 유효패 수를 비교합니다.')+warn('복합형은 하나의 패가 여러 블록 후보에 걸칠 수 있으므로 기계적으로 나누지 않습니다.'),
'<h3>울기는 언제?</h3><p>강의의 기본 울기 대상은 <b>역패·탕야오·혼일색</b>입니다. 울기 전에 성립할 역이 있는지 확인합니다.</p><h3>리치는 언제?</h3><p>멘젠 텐파이라면 리치를 기본 선택으로 두고, 가능한 대기 중 <b>남은 화료패가 많은 대기</b>를 확인합니다.</p>'+warn('리치는 멘젠이 필요합니다. 울면 일반적으로 리치할 수 없습니다.'),
'<h3>단순 공수 규칙</h3><p><b>텐파이 → 공격</b>, <b>노텐 → 수비</b>를 우선 연습합니다. 단, <b>4위일 때는 예외</b>를 고려합니다.</p><p>이는 강의에서 초보자의 판단 부담을 줄이기 위한 규칙입니다. 실제 실전에서는 점수·순목·상대 위험도에 따라 텐파이여도 접을 수 있습니다.</p>'+note('승패 하나에 흔들리지 않고 같은 판단을 반복해 보는 것이 핵심입니다.'),
'<h3>한 국 복습 루틴</h3><ol><li>배패에서 네 가지 역 중 무엇을 목표로 했는가?</li><li>고립패보다 강한 블록을 먼저 버리지는 않았는가?</li><li>6블록 이상일 때 무엇을 비교해 정리했는가?</li><li>울었다면 확실한 역이 있었는가?</li><li>텐파이에서 리치·대기 매수를 확인했는가?</li><li>상대 공격 때 텐파이와 순위를 확인했는가?</li></ol><p>익숙해질 때까지 매 국 이 여섯 질문을 반복하세요.</p>'
];
const qs=[['강의에서 우선 익히라고 권한 역이 아닌 것은?',['리치','역패','국사무쌍'],'2','초반에는 특수 역을 의도적으로 노리기보다 기본 역을 우선합니다.'],['보통 가장 먼저 정리할 후보는?',['고립된 불필요한 자패','좋은 양면 블록','완성 몸통'],'0','불필요한 고립 자패부터 확인하는 것이 기본 순서입니다.'],['기본 화료형의 구성은?',['몸통 3개+머리 2개','몸통 4개+머리 1개','몸통 5개'],'1','4몸통과 1머리를 목표로 5블록을 관리합니다.'],['확실한 역 없이 울면?',['리치 가능','역이 없어 화료하지 못할 수 있음','항상 유리함'],'1','울기 전에 화료할 수 있는 역을 확인해야 합니다.'],['강의의 단순 공수 기준은?',['노텐이면 무조건 밀기','텐파이면 공격·노텐이면 수비','항상 공격'],'1','4위 등의 예외가 있고, 숙련되면 더 정교하게 판단합니다.']];
function quizRender(){$('quiz').innerHTML=qs.map((q,i)=>'<div class="quiz"><b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((o,j)=>'<button class="choice '+(s.quiz[i]===String(j)?'on':'')+'" onclick="answer('+i+','+j+')">'+o+'</button>').join('')+(s.quiz[i]===undefined?'':'<div class="'+(s.quiz[i]===q[2]?'hint':'warn')+'">'+(s.quiz[i]===q[2]?'정답! ':'다시 확인해 보세요. ')+q[3]+'</div>')+'</div>').join('');}
function answer(i,j){s.quiz[i]=String(j);save();quizRender()}function resetQuiz(){s.quiz={};save();quizRender()}function renderStudy(){$('topics').innerHTML=topics.map((t,i)=>'<button class="'+(s.topic===i?'primary':'')+'" onclick="s.topic='+i+';save();renderStudy()">'+t+'</button>').join('');$('studyContent').innerHTML=study[s.topic];quizRender()}
function resetStep(){Object.keys(s.checks).forEach(k=>{if(([['y'],['d'],['b'],['c'],['r'],['f']][s.step]).some(p=>k.startsWith(p)))delete s.checks[k]});save();render()}function resetHand(){if(!confirm('이번 국의 선택과 체크를 초기화할까요? 복습 퀴즈 기록은 유지됩니다.'))return;s.step=0;s.checks={};s.choices={};save();render()}function render(){$('mode-play').classList.toggle('on',s.mode==='play');$('mode-study').classList.toggle('on',s.mode==='study');$('play').classList.toggle('hidden',s.mode!=='play');$('study').classList.toggle('hidden',s.mode!=='study');if(s.mode==='play')renderPlay();else renderStudy()}render();
</script></body></html>
